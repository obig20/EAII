# deploy/nginx.conf
# Nginx Reverse Proxy Configuration for Daily Close (Birana Technology)
# Designed for Ubuntu 22.04 / Debian 12 host in Addis Ababa

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format omitting sensitive PII
    log_format dailyclose_combined '$remote_addr - $remote_user [$time_local] '
                                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                   '"$http_referer" "$http_user_agent" '
                                   'rt=$request_time';

    access_log /var/log/nginx/dailyclose.access.log dailyclose_combined;
    error_log /var/log/nginx/dailyclose.error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Hide Nginx version

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # File upload cap: 12MB (application enforces 10MB limit)
    client_max_body_size 12M;

    # Rate limiting zones
    # Retailer confirmation links: 15 req/min per IP
    limit_req_zone $binary_remote_addr zone=retailer_limit:10m rate=15r/m;
    # General API / web endpoints: 100 req/min per IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;
    limit_req_status 429;

    upstream dailyclose_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name dailyclose.birana.et;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name dailyclose.birana.et;

        # TLS configuration
        ssl_certificate /etc/letsencrypt/live/dailyclose.birana.et/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dailyclose.birana.et/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Strict Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

        # Public Retailer Balance Confirmation (Rate Limited)
        location /confirm-balance/ {
            limit_req zone=retailer_limit burst=5 nodelay;

            proxy_pass http://dailyclose_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Health Check (Monitoring)
        location = /health {
            proxy_pass http://dailyclose_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Static Assets Caching
        location /static/ {
            alias /opt/dailyclose/app/channels/web/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Main Web App & API
        location / {
            limit_req zone=general_limit burst=20 nodelay;

            proxy_pass http://dailyclose_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
