# deploy/docker-compose.prod.yml
# Production Docker Compose for Daily Close on Single Ethiopian Linux Server
version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: dailyclose_prod_db
    restart: always
    environment:
      POSTGRES_DB: dailyclose
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ../docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Expose only on loopback for host backups/maintenance; never on 0.0.0.0
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dailyclose"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dailyclose_prod_migrate
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_MIGRATION_URL}
    networks:
      - internal_net

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dailyclose_prod_web
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips='*'
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://app:${DB_PASSWORD}@db:5432/dailyclose
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_ENV=production
    networks:
      - internal_net

  telegram_bot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dailyclose_prod_bot
    restart: always
    command: python -m app.channels.telegram.bot
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+psycopg://app:${DB_PASSWORD}@db:5432/dailyclose
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_ENV=production
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  pgdata_prod:
    driver: local
